<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>MXI: Mathematics x Intelligence</title>
  <meta name="description" content="MXI: Mathematics x Intelligence. Exploring intelligence that perceives, reasons, predicts, and acts.">
  <link rel="canonical" href="https://mxiteam.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MXI: Mathematics x Intelligence">
  <meta property="og:description" content="Exploring intelligence that perceives, reasons, predicts, and acts.">
  <meta property="og:url" content="https://mxiteam.github.io/">
  <meta property="og:image" content="https://mxiteam.github.io/assets/mxi-logo.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="./assets/mxi-logo.png" type="image/png">
  <link rel="stylesheet" href="./styles.css?v=8">
  <script src="./particle-shaders.js?v=8" defer></script>
  <script src="./particles.js?v=8" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="MXI: Mathematics x Intelligence">
        <img src="./assets/mxi-logo.png" width="42" height="42" alt="" fetchpriority="high">
        <span>MXI</span>
      </a>
      <a class="header-github" href="https://github.com/MXITeam" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="main" class="hero container">
    <div class="particle-stage" id="particle-stage" role="group" tabindex="0" aria-label="Interactive binary MXI sculpture" aria-describedby="field-help">
      <h1 class="particle-wordmark">MXI</h1>
      <canvas id="mxi-particles" aria-hidden="true"></canvas>
      <span class="particle-corner top-left" aria-hidden="true"></span><span class="particle-corner top-right" aria-hidden="true"></span><span class="particle-corner bottom-left" aria-hidden="true"></span><span class="particle-corner bottom-right" aria-hidden="true"></span>
    </div>
    <div class="hero-statement">
      <p class="hero-tagline">Mathematics x Intelligence</p>
      <p class="hero-description">Exploring intelligence that perceives, reasons, predicts, and acts.</p>
    </div>
    <div class="hero-footnote">
      <p id="field-help"><span class="desktop-hint">Move to bend the field. Click to send a wave.</span><span class="touch-hint">Tap to send a wave.</span><span class="sr-only">When the sculpture is focused, press Enter to send a wave.</span></p>
      <button id="motion-toggle" class="motion-toggle" type="button" hidden><span class="motion-icon" aria-hidden="true">Ⅱ</span><span class="motion-label">Pause animation</span></button>
    </div>
  </main>
</body>
</html>
